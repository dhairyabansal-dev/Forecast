version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ntf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ntf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ntf_password}
      POSTGRES_DB: ${POSTGRES_DB:-ntf_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ntf_user} -d ${POSTGRES_DB:-ntf_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ntf_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
